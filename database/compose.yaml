services:
  postgres:
    image: postgres:17
    container_name: tinyvm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tinyvm
      POSTGRES_USER: tinyvm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tinyvm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyvm -d tinyvm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tinyvm_pgdata:
