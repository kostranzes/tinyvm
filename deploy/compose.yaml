services:
  caddy:
    image: caddy:2
    container_name: tinyvm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
      - tinyvm_caddy_data:/data

volumes:
  tinyvm_caddy_data: